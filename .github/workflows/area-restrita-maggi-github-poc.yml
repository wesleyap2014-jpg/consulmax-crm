name: Área Restrita Maggi - GitHub Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-restrita-maggi-github-runner
  cancel-in-progress: false

jobs:
  executar:
    name: Executar worker com validação manual do Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verificar configuração
        env:
          AREA_RESTRITA_PORTAL_URL: ${{ secrets.AREA_RESTRITA_PORTAL_URL }}
          AREA_RESTRITA_USERNAME: ${{ secrets.AREA_RESTRITA_USERNAME }}
          AREA_RESTRITA_PASSWORD: ${{ secrets.AREA_RESTRITA_PASSWORD }}
          AREA_RESTRITA_VNC_PASSWORD: ${{ secrets.AREA_RESTRITA_VNC_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for name in AREA_RESTRITA_PORTAL_URL AREA_RESTRITA_USERNAME AREA_RESTRITA_PASSWORD AREA_RESTRITA_VNC_PASSWORD SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret ausente::Configure o secret $name no repositório."
              missing=1
            fi
          done
          exit "$missing"

      - name: Executar Área Restrita Maggi
        id: worker
        working-directory: workers/area-restrita-worker
        env:
          AREA_RESTRITA_PORTAL_URL: ${{ secrets.AREA_RESTRITA_PORTAL_URL }}
          AREA_RESTRITA_USERNAME: ${{ secrets.AREA_RESTRITA_USERNAME }}
          AREA_RESTRITA_PASSWORD: ${{ secrets.AREA_RESTRITA_PASSWORD }}
          AREA_RESTRITA_VNC_PASSWORD: ${{ secrets.AREA_RESTRITA_VNC_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AREA_RESTRITA_AI_MODEL: ${{ vars.AREA_RESTRITA_AI_MODEL }}
        run: bash scripts/run-github-actions-poc.sh

      - name: Publicar diagnóstico técnico
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: area-restrita-maggi-github-runner
          path: workers/area-restrita-worker/artifacts/github-actions-poc
          if-no-files-found: warn
          retention-days: 3
