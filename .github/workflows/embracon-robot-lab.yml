name: Laboratório Robôs Embracon

on:
  workflow_dispatch:
    inputs:
      run_login_diagnostic:
        description: Abrir a página inicial e gerar diagnóstico seguro
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: embracon-robot-lab
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Preparar ambiente Embracon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar dependências do worker
        working-directory: workers/embracon-worker
        run: npm install --no-audit --no-fund

      - name: Compilar worker Embracon
        working-directory: workers/embracon-worker
        run: npm run build

      - name: Validar estrutura compilada
        working-directory: workers/embracon-worker
        run: test -f dist/index.js

      - name: Diagnosticar página inicial da Embracon
        if: ${{ inputs.run_login_diagnostic }}
        working-directory: workers/embracon-worker
        env:
          EMBRACON_ROBOT_PORTAL_URL: ${{ secrets.EMBRACON_ROBOT_PORTAL_URL }}
        run: node scripts/run-login-diagnostic.mjs

      - name: Salvar diagnóstico para análise
        if: ${{ always() && inputs.run_login_diagnostic }}
        uses: actions/upload-artifact@v4
        with:
          name: embracon-login-diagnostic
          path: workers/embracon-worker/artifacts/
          if-no-files-found: ignore
          retention-days: 7
