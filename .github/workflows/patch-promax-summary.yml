name: Patch Pro Max Summary

on:
  push:
    paths:
      - '.github/workflows/patch-promax-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch-promax-summary.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/propostas-pro-max/modelos/ProMaxModelosHub.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: detalhar antecipacao restante no resumo Pro Max"
          git push
