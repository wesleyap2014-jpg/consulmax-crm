name: Validar worker Área Restrita Maggi

on:
  pull_request:
    paths:
      - "workers/area-restrita-worker/**"
      - ".github/workflows/validate-area-restrita-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compilar worker Área Restrita
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    defaults:
      run:
        working-directory: workers/area-restrita-worker
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Instalar dependências
        run: npm ci
      - name: Validar worker
        run: npm run build
